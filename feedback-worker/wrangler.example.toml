name = "cedar-feedback"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
CEDAR_WEB_ORIGIN = "https://cedartv.github.io"
# Discord triage (optional; leave empty to run without Discord).
DISCORD_PUBLIC_KEY = ""
DISCORD_TRIAGE_CHANNEL_ID = ""
DISCORD_ROADMAP_CHANNEL_ID = ""
DISCORD_OWNER_ID = ""
# Public forums whose new posts the five-minute cron imports into triage (optional).
DISCORD_BUG_FORUM_ID = ""
DISCORD_FEATURE_FORUM_ID = ""

# Secrets (set with `wrangler secret put`, never committed):
#   ADMIN_TOKEN      bearer token the local Cedar Tracker uses to read and triage the inbox
#   CLIENT_HASH_SALT random string that keys the per-day abuse counter
#   DISCORD_BOT_TOKEN bot token that posts and edits triage messages (optional)

[[d1_databases]]
binding = "DB"
database_name = "cedar-feedback"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *", "41 4 * * *"]

[[ratelimits]]
name = "SUBMIT_RATE_LIMITER"
namespace_id = "17101"

  [ratelimits.simple]
  limit = 3
  period = 60

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "17102"

  [ratelimits.simple]
  limit = 120
  period = 60
